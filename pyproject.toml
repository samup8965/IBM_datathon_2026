[project]
name = "ibm-datathon-2026"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Pinned to the versions on the LinuxONE server, so code and saved models behave
    # the same on laptops and on the z17. Change these only together with the server.
    "joblib==1.6.0",
    "numpy==2.0.2",
    "pandas==3.0.6",
    "scikit-learn==1.9.0",
    "torch==2.11.0",
    "xgboost==3.4.1",
    # Not model-critical, so not pinned
    "matplotlib>=3.11.2",
    "requests>=2.33.0",
    # Not installed on the server yet (needed for app/api.py)
    "fastapi>=0.143.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

# `uv sync` installs the `src` folder as a package, so `from src.model import ...`
# works from scripts/, notebooks/ and app/ alike.
[tool.uv.build-backend]
module-name = "src"
module-root = ""

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]

# On Linux, take torch from PyTorch's CPU-only build; the default PyPI build pulls in
# ~3 GB of NVIDIA GPU libraries. macOS and Windows PyPI builds are already CPU-only.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
